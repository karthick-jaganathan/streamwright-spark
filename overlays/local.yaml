# ==============================================================================
# Host Local Overlay (Run directly on macOS / local Python without Docker container)
# ==============================================================================
# Connects to background services running on localhost:
#   - Apache Kafka:       127.0.0.1:9094
#   - LocalStack (S3):    127.0.0.1:4566
#   - PostgreSQL:         127.0.0.1:5432
#
# Usage:
#   sw spark validate examples/s3_events_to_delta --overlay overlays/local.yaml --strict
#   sw spark run examples/s3_events_to_delta --overlay overlays/local.yaml --once
# ==============================================================================

connections:
  # Route Kafka bus to local broker
  bus:
    security_protocol: PLAINTEXT
    sasl_mechanism: null
    region: null

  # Route S3 landing and lake storage to LocalStack
  landing:
    endpoint: "127.0.0.1:4566"
    url_style: path
    use_ssl: false

  lake:
    endpoint: "127.0.0.1:4566"
    url_style: path
    use_ssl: false

  lake_delta: {}

  # Route PostgreSQL database to local postgres
  reporting_db:
    host: 127.0.0.1
    port: 5432
    database: streamwright
    user: sw
    sslmode: disable

  ops_db:
    host: 127.0.0.1
    port: 5432
    database: streamwright
    user: sw
    sslmode: disable

runtime:
  secrets: null
  platform:
    type: local
  spark:
    conf:
      spark.checkpoint.dir: "/tmp/spark_checkpoints"
      spark.dynamicAllocation.enabled: "false"
      spark.dynamicAllocation.maxExecutors: null
      spark.executor.memory: 2g
      spark.executor.cores: "2"
      spark.sql.catalogImplementation: "hive"
      spark.hadoop.hive.metastore.uris: "thrift://127.0.0.1:9083"
