# Connector contract v1 coding standards (docs/design/connector-contract.md §6).
line-length = 120
target-version = "py311"
extend-exclude = ["docs/_site", "**/build", "**/.venv"]

[lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "PL", "RUF", "N", "C90"]
extend-select = ["PLC0415", "PLW0603", "RUF012"]
ignore = ["PLR0913", "PLR2004", "UP031"]

[lint.mccabe]
max-complexity = 15

[lint.pylint]
max-branches = 15
max-returns = 8
max-statements = 60

[lint.isort]
known-first-party = ["streamwright", "streamwright_mcp"]
split-on-trailing-comma = false

[lint.per-file-ignores]
"**/tests/**" = ["PLR2004", "N802"]
